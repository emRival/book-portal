version: '3.8'

services:
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3055:3055"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
      - ./server/prisma/dev.db:/app/prisma/dev.db
    environment:
      - PORT=3055
      - DOMAIN=https://book.idnbogor.id
    # Public DNS fallback — fixes "getaddrinfo EAI_AGAIN challenges.cloudflare.com"
    # when the default Docker/host DNS cannot resolve external domains.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80" # Nginx
    restart: always
